<html>
    <head>
        <title>Creating Forms in HTML </title>
    </head>
    <body>

        <form action="./response.html" name="rj" target="_blank" method="get">
            <fieldset>

                <legend>Personal Details</legend>

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your name"  required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email"  placeholder="enter your email" name="email" reqquired>
                <br><br>

                <label for="dob">DOB:</label>
                <input type="date" id="dob" name="dob" required>
                <br><br>

                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone" placeholder="123-456-7890" required>
                <br><br>

                <label for="address">Address:</label>
                <textarea name="address" id="address" rows="5" cols="30"  required ></textarea>
                <br><br>

                <label for="password" >Password:</label>
                <input type="password" id="password" name="password" placeholder="enter ur password" required>
                <br><br>

                <label for="attempt">Attempt:</label>
                <input type="number" id="attempt" name="attempt" min="1" max="5" required>
                <br><br>

                <label for="gender">Gender:</label>
                <input type="radio" id="male" name="gender" value="male" required>
                <label type="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label type="female">Female</label>
                <br><br>

                <label for="checkbox">Vechicles you have:</label>
                <input type="checkbox" id="car" name="veh1">
                <label for="car">Car</label>
                <input type="checkbox" id="bike" name="veh2">
                <label for="bike">Bike</label>
                <br><br>

                <label for="sel">Select:</label>
                <select name="sel" id="sel">
                <option>select a option</option>

                <optgroup label="Programming Languages">
                    
                <option value="c">C</option>
                <option value="c">C++</option>
                <option value="c">JAVA</option>
                </optgroup>
                <optgroup label="Fronted development ">
                <option value="c">HTML</option>
                <option value="c">CSS</option>
                <option value="c">JAVAscript</option>
                </optgroup>
                </select>
                <br><br>

                <label for="upload" >File Upload:</label>
                <input type="file" required>
                <br><br>

                <label for="appointment">Appointment:</label>
                <input type="time">
                <br><br>

                <input type="Submit">
                <input type="Reset">








            </fieldset>
        </form>
    </body>
</html>
